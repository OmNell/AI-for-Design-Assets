# Windows 正式部署模板。真实秘密由安装器提示输入并加密。
mode: prod
bootstrap_admin: ''
server:
  host: 0.0.0.0
  port: 8080
  session_hours: 8
  public_base_url: http://nas-workbench.company.local:8080
nas:
  host: nas.company.local
  dsm_port: 5001
  dsm_https: true
  share: 设计资产共享
  root_path: /设计资产
  temp_path: /工作台临时区
  backup_path: /_工作台备份
  system_user: wb-system
  system_password_enc: ''
  dsm_ca_file: null
ai:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_enc: ''
  model_vision: ''
  model_text: ''
  model_embed: ''
upload:
  chunk_mb: 8
  parallel_files: 3
  fingerprint_algorithm: sha256
purge:
  cooling_days: 30
schedule:
  inspection: '0 2 * * *'
  backup: '0 3 * * *'
paths:
  data_dir: ./data
