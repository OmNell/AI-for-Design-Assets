# 复制到仓库根目录 config.yaml；本文件不含真实凭据。
mode: dev
bootstrap_admin: demo-admin  # dev 演示管理员；prod 请改为真实项目负责人 NAS 账号。
server:
  host: 0.0.0.0
  port: 8080
  session_hours: 8
nas:
  host: 192.168.0.177
  dsm_port: 5001
  dsm_https: true
  share: 设计资产共享
  root_path: /设计资产
  temp_path: /工作台临时区
  backup_path: /_工作台备份
  idle_minutes: 30
  timeout_s: 30
  dsm_ca_file: null  # 自签名证书的受信 CA PEM 文件，不关闭证书校验。
  system_user: wb-system
  system_password_enc: ""
jobs:
  workers: 4
upload:
  chunk_mb: 8
  parallel_files: 3
  full_fingerprint_max_mb: 200
  append_max_mb: 50  # 核对页追加单张主图的大小上限
ai:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_enc: ""
  model_vision: ""
  model_text: ""
  model_embed: ""
  concurrency: 3
  timeout_s: 60
  retries: 3
  stall_alert_min: 30
review:
  overdue_days: 3
purge:
  cooling_days: 30
schedule:
  inspection: "0 2 * * *"
  backup: "0 3 * * *"
search:
  vector_backend: auto  # auto / sqlite-vec / numpy（后备：向量存 BLOB，用 numpy 算余弦相似度）
  vector_top_k: 50
  max_candidates: 60
  relax_below: 10
paths:
  data_dir: ./data
  dev_nas_dir: ./devdata/nas
# 仅 dev 模式使用的假账号，禁止填写真实 NAS 密码。
dev_users:
  - username: demo-uploader
    password: demo-uploader-only
    permissions: {formal: read, temp: write, backup: none}
  - username: demo-first
    password: demo-first-only
    permissions: {formal: read, temp: write, backup: none}
  - username: demo-final
    password: demo-final-only
    permissions: {formal: write, temp: write, backup: none}
  - username: demo-noaccess  # 对正式目录没有读权限，用来验证下载时的「NAS 无权限」
    password: demo-noaccess-only
    permissions: {formal: none, temp: write, backup: none}
  - username: demo-admin
    password: demo-admin-only
    permissions: {formal: read, temp: write, backup: none}
