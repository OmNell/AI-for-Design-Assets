# 检索考卷
#
# 用途：每次调整字段说明、提示词、候选数量或换模型之后跑一遍，看三项指标有没有变差。
#   海选命中率  正确答案有没有进入候选（最多 60 条）——漏在这里，后面怎么排都救不回来
#   前 3 / 前 10 命中率  正确答案排得够不够靠前
#   平均耗时、模型调用次数  快不快、贵不贵
#
# 怎么填：
#   - 收集 100～200 条同事真实会搜的话，编号、属性、场景三类大致各占三分之一。
#   - query    用户原话，照抄，不要替他改写得更「规范」。
#   - type     编号 / 属性 / 场景
#                编号：直接输入立项编号或商品编号
#                属性：说的是东西本身（品类、材质、颜色、工艺……）
#                场景：说的是给谁用、什么时候用（过年送领导、员工福利……）
#   - answers  正确的商品编号，可以写多个；命中其中任意一个就算对。
#              编号在商品详情页或单品档案里能看到，形如 P2026-0012-003。
#   - note     可选，写给以后看考卷的人。
#   - 上线后每月从搜索日志里挑「搜了却没点任何结果」的查询补进来。
#
# 怎么跑（工作台需要已经启动）：
#   python scripts/run_exam.py --base-url http://localhost:8080 --username 你的账号
#
# 下面 10 条是示例，编号是虚构的；填入真实数据后请删除或替换。
exam:
  - query: "P2026-0012-003"
    type: 编号
    answers: ["P2026-0012-003"]
  - query: "p2026-0012"
    type: 编号
    answers: ["P2026-0012-001", "P2026-0012-002", "P2026-0012-003"]
    note: 输入立项编号，项目下任意一个商品排进结果即可
  - query: "H2025-0003-001"
    type: 编号
    answers: ["H2025-0003-001"]
    note: 历史项目的补发编号
  - query: "红色陶瓷摆件"
    type: 属性
    answers: ["P2026-0031-002"]
  - query: "双层玻璃杯 烫金"
    type: 属性
    answers: ["P2026-0044-001", "P2026-0044-004"]
  - query: "胡桃木 抽屉式礼盒"
    type: 属性
    answers: ["P2026-0012-007"]
  - query: "不要塑料的保温杯"
    type: 属性
    answers: ["P2026-0058-002"]
    note: 带排除条件
  - query: "过年送领导的小摆件"
    type: 场景
    answers: ["P2026-0031-002", "P2026-0031-005"]
    note: 标签里写的可能是「春节」「新年」「企业客户」，考的就是同义说法
  - query: "中秋给员工发的福利"
    type: 场景
    answers: ["P2026-0012-007"]
  - query: "户外出行用的折叠伞，送客户"
    type: 场景
    answers: ["P2026-0066-001"]
